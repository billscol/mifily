name: mifily

services:
  app:
    image: ghcr.io/billscol/mifily:latest
    container_name: mifily_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker sets HOSTNAME to the container ID by default, and Next.js's
      # standalone server.js binds to $HOSTNAME via a DNS lookup (getaddrinfo),
      # which fails since the container ID isn't a resolvable name. Force it
      # to bind on all interfaces instead.
      HOSTNAME: "0.0.0.0"
      # Point the @upstash/redis client (apps/web/lib/upstash/redis.ts) at the
      # self-hosted redis-http proxy instead of Upstash's (now-deleted) free
      # database. env_file values aren't ${}-expanded, so this has to live
      # here rather than in .env, with REDIS_HTTP_TOKEN as the one source of
      # truth for the shared secret.
      UPSTASH_REDIS_REST_URL: http://redis-http:80
      UPSTASH_REDIS_REST_TOKEN: ${REDIS_HTTP_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host's MariaDB
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - mifily_net

  admin:
    image: ghcr.io/billscol/mifily-admin:latest
    container_name: mifily_admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host's MariaDB
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      MAIN_APP_INTERNAL_URL: http://app:3000
      ADMIN_INTERNAL_SECRET: ${ADMIN_INTERNAL_SECRET}
    ports:
      - "127.0.0.1:3013:3000"
    networks:
      - mifily_net
    depends_on:
      - app

  # Reemplaza Upstash Redis (plan gratuito, se borró por inactividad) con un
  # Redis propio + un proxy REST compatible con el cliente @upstash/redis
  # que ya usa el código (ver apps/web/lib/upstash/redis.ts) - así no hace
  # falta tocar ninguna línea de app code, solo UPSTASH_REDIS_REST_URL/TOKEN
  # en el .env para que apunten aquí en vez de a Upstash.
  redis:
    image: redis:7-alpine
    container_name: mifily_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mifily_net

  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: mifily_redis_http
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_HTTP_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis
    networks:
      - mifily_net

  minio:
    image: minio/minio:latest
    container_name: mifily_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:3011:9000"
      - "127.0.0.1:3012:9001"
    networks:
      - mifily_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mifily_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET}
      STORAGE_PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$STORAGE_PUBLIC_BUCKET &&
      mc mb --ignore-existing local/$$STORAGE_PRIVATE_BUCKET &&
      mc anonymous set download local/$$STORAGE_PUBLIC_BUCKET
      "
    networks:
      - mifily_net
    restart: "no"

  # Reemplaza los Vercel Cron Jobs del vercel.json original: llama a los
  # endpoints /api/cron/* directamente por la red interna de Docker (nunca
  # sale a internet, así que no depende de CRON_SECRET para estar protegido).
  cron:
    image: alpine:3.20
    container_name: mifily_cron
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_URL: http://app:3000
    volumes:
      - ./deploy/crontab.template:/etc/crontabs/root.template:ro
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl gettext >/dev/null 2>&1 &&
      envsubst < /etc/crontabs/root.template > /etc/crontabs/root &&
      crond -f -l 2
      "
    networks:
      - mifily_net

networks:
  mifily_net:
    driver: bridge

volumes:
  minio_data:
  redis_data:
